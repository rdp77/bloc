# Bloc Workflow Add Or Update Lint Rule

## Action

Follow the add-or-update-lint-rule workflow:
1. Implement or update the rule in lib/src/rules/ and lib/src/rules/rules.dart.
2. Update all.yaml, recommended.yaml, and bloc_lint.dart to register the rule.
3. Add or update tests in test/src/rules/.
4. Update README.md and documentation in docs/src/components/lint-rules/ and docs/src/content/docs/lint-rules/.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: packages/bloc_lint/lib/src/rules/*.dart, packages/bloc_lint/lib/src/rules/rules.dart, packages/bloc_lint/lib/all.yaml

